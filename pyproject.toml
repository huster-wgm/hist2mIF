[project]
name = "hist2mif"
version = "0.1.0"
description = "H&E to virtual multiplex immunofluorescence (GigaTIME) web UI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "albumentations>=1.4.0,<2",
  "fastapi>=0.115.0",
  "huggingface_hub>=0.26.0",
  "imageio>=2.34.0",
  "numpy>=2.0.0,<3",
  "pillow>=10.4.0",
  "pyyaml>=6.0.0",
  "tifffile>=2024.8.0",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "tqdm>=4.66.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.32.0",
  "imagecodecs>=2026.3.6",
  "zarr>=3.1.6",
]

[project.scripts]
hist2mif = "hist2mif.main:main"
hist2mif-cli = "hist2mif.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hist2mif"]

[tool.hatch.build.targets.wheel.sources]
hist2mif = "src/hist2mif"

# Pin torch/torchvision to PyTorch's official CUDA 12.8 wheel index on Linux/Windows.
# These wheels bundle the matching cuDNN/NCCL/CUDA runtime and load them via torch's
# own loader — no LD_LIBRARY_PATH hacks needed. Falls back to PyPI on macOS.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
]

[project]
name = "hist2mif"
version = "0.1.0"
description = "H&E to virtual multiplex immunofluorescence (GigaTIME) web UI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "albumentations>=1.4.0,<2",
  "gradio>=5.0.0,<6",
  "huggingface_hub>=0.26.0",
  "imageio>=2.34.0",
  "numpy>=2.0.0,<3",
  "pillow>=10.4.0",
  "pyyaml>=6.0.0",
  "tifffile>=2024.8.0",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "tqdm>=4.66.0",
]

[project.scripts]
hist2mif = "hist2mif.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hist2mif"]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
]
